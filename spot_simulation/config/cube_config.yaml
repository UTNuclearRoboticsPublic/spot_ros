spot_simulation:
  ros__parameters:
    object_names: [cube, room, cylinder] # ,mesh_object

    objects:
      cube:
        object_type: box
        dimensions: [1.0, 0.5, 0.75]
        location: [2.0, 0.0, 0.375]
        yaw: 90.0

      room:
        object_type: box
        dimensions: [10.0, 10.0, 4.5]
        location: [0.0, 0.0, 2.25]

      cylinder:
        object_type: cylinder
        dimensions: [2.0, 0.5]
        location: [0.0, 2.0, 1.0]
        roll: 90.0
        pitch: 15.0

      sphere:
        object_type: sphere
        dimensions: [0.75] # radius
        location: [-3.0, 0.0, 2.0]
