spot_nav/controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.1
    min_y_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0
    
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController

      motion_model: Omni
      temperature: 0.75

      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.5
      vy_std: 0.5
      wz_std: 1.5

      vx_max: 0.7
      vx_min: -0.7
      vy_max: 0.7
      vy_min: -0.7
      wz_max: 1.0
      wz_min: -1.0

      ax_max: 10.0
      ax_min: -10.0
      ay_max: 10.0
      ay_min: -10.0
      az_max: 10.0

      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: true

      # Critic config
      critics: ["PathFollowCritic", "GoalCritic", "GoalAngleCritic", "PathAngleCritic", "PathAngleCritic", "ObstaclesCritic", "ConstraintCritic"]

      # These drive the robot to the goal
      ConstraintCritic:
        enabled: true
      PathFollowCritic:
        enabled: true
        cost_weight: 10.0
        cost_power: 1
        threshold_to_consider: 1.0
      ObstaclesCritic:
        enabled: true
        cost_weight: 0.1
        cost_power: 1
        collision_margin_distance: 0.05
        near_goal_distance: 1.0
        consider_footprint: true
        cost_scaling_factor: 3.0
        inflation_radius: 5.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.1
        critical_cost: 0.0
        # critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_collision_cost: 255
        near_goal_distance: 1.0
        trajectory_point_step: 1

      # These shape how the robot moves along the way
      PathAngleCritic:
        enabled: true
        threshold_to_consider: 1.0
        max_angle_to_furthest: 0.10
        mode: 1
      PathAlignCritic:
        enbaled: true
        threshold_to_consider: 1.0
        use_path_orientations: true

      # These apply once in range of the goal
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        threshold_to_consider: 100.0
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        threshold_to_consider: 1.0


spot_nav/local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: spot_nav/map
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.52, 0.10], [0.52, -0.10], [-0.62, -0.10], [-0.62, 0.10]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 5.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: velodyne
        velodyne:
          topic: /velodyne_points
          min_obstacle_height: 0.20
          max_obstacle_height: 1.2
          clearing: True
          marking: True
          data_type: "PointCloud2"
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 25
        min_obstacle_height: 0.15
        max_obstacle_height: 1.2
        mark_threshold: 0
        footprint_clearing_enabled: false
        observation_sources: velodyne
        velodyne:
          topic: /velodyne_points
          min_obstacle_height: 0.15
          max_obstacle_height: 1.2
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

spot_nav/global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: spot_nav/map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.1
      resolution: 0.05
      footprint: "[[0.52, 0.10], [0.52, -0.10], [-0.62, -0.10], [-0.62, 0.10]]"
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] # voxel_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: velodyne
        velodyne:
          topic: /velodyne_points
          min_obstacle_height: 0.20
          max_obstacle_height: 1.2
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.2
        mark_threshold: 0
        observation_sources: velodyne
        velodyne:
          topic: /velodyne_points
          min_obstacle_height: 0.20
          max_obstacle_height: 1.2
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 3.0
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

spot_nav/map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "daniel_ahg.yaml"

spot_nav/planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D" # In Iron and older versions, "/" was used instead of "::"
      tolerance: 0.125                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false             # whether or not to downsample the map
      downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                   # allow traveling in unknown space
      max_iterations: 1000000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 2.0                # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

spot_nav/recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: spot_nav/map
    robot_base_frame: body
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

spot_nav/waypoint_follower:
  ros__parameters:
    loop_rate: 2000
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

spot_nav/behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

spot_nav/velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "CLOSED_LOOP"
    max_velocity: [1.6, 1.6, 1.2]
    min_velocity: [-0.8, -0.8, -1.2]
    velocity_timeout: 1.0
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-5.0, -5.0, -8.0]
    odom_topic: "/spot_driver/odom"
    odom_duration: 0.1
