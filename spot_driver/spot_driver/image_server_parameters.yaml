spot_driver_parameters:
  hostname:
    type: string
    description: Spot computer hostname
    default_value: '192.168.50.3'
    validation:
      not_empty<>: null
  
  image_sources:
    type: string_array
    description: The image sources to register with the Boston Dynamics API
    default_value:
      - frontleft
      - frontright
      - left
      - right
      - back
      - hand_rgb
      - hand_tof
    validation:
      subset_of<>: [[frontleft, frontright, left, right, back, hand_rgb, hand_tof]]
      unique<>: null

  rgb_jpeg:
    type: bool
    description: Request RGB sources as JPEG and publish them as sensor_msgs/CompressedImage on ~/<source>/image/compressed instead of raw Image. Depth, the get_images service, and static TF stay raw.
    default_value: false

  jpeg_quality:
    type: int
    description: JPEG quality percent passed to the Spot SDK when rgb_jpeg is enabled
    default_value: 75
    validation:
      bounds<>: [1, 100]

  fps_debug:
    type: bool
    description: Log a periodic per-source summary of achieved frame rate, SDK round-trip latency, and bandwidth. Logging only, no behavior change.
    default_value: false

  fps_debug_window:
    type: double
    description: Length in seconds of each fps_debug summary window
    default_value: 5.0
    validation:
      gt<>: 0.0

  rates:
    __map_image_sources:
      rgb:
        type: double
        description: The rate to publish color images from this source. Set to zero to disable continous publishing
        default_value: 1.0
        validation:
          gt_eq<>: 0.0

      depth:
        type: double
        description: The rate to publish depth images from this source. Set to zero to disable continous publishing 
        default_value: 1.0
        validation:
          gt_eq<>: 0.0
